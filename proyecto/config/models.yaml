# Modelos por agente. Es la única fuente efectiva: el código lee este archivo
# al inicializar cada agente y falla si falta una entrada.
# DOCUMENT_INTELLIGENCE_MODEL puede sobrescribir el modelo de visión.
# DOCUMENT_PDF_MODEL puede sobrescribir el modelo de OCR de PDF.
# DOCUMENT_RELEVANCE_MODEL puede sobrescribir el filtro de relevancia.

agents:
  orchestrator:
    provider: ollama
    model: "mimo-v2.6"

  data_steward:
    provider: ollama
    model: "qwen2.5:7b-instruct"

  normatividad_rag:
    provider: ollama
    model: "llama3.1:latest"

  data_analyst:
    provider: ollama
    model: "mimo-v2.6"

  document_intelligence:
    provider: ollama
    model: "qwen2.5vl:7b"

  # Filtro de relevancia de archivos adjuntos: decide si un documento ambiguo
  # está relacionado con banca o finanzas.
  document_relevance:
    provider: ollama
    model: "qwen2.5:7b-instruct"

# OCR de PDF: no es un agente, pero comparte la misma configuración de modelos.
document_pdf:
  provider: ollama
  model: "qwen2.5vl:3b"