# Agent model configuration.
# Referencia de los modelos que usa cada agente. Hoy cada agente lee su modelo
# desde su propio código; este archivo documenta el valor efectivo.
# Si cambias un modelo, actualiza también el agente correspondiente.

agents:
  orchestrator:
    provider: ollama
    model: "qwen2.5:7b-instruct"

  data_steward:
    provider: ollama
    model: "llama3.1:latest"

  normatividad_rag:
    provider: ollama
    model: "llama3.1:latest"

  data_analyst:
    provider: ollama
    model: "qwen2.5:7b-instruct"

  document_intelligence:
    provider: ollama
    model: "qwen2.5vl:7b"

  compliance:
    provider: ollama
    model: "llama3.1:latest"
