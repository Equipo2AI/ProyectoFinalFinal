# Preguntas sobre leyes, avisos de privacidad y políticas (agente RAG).
# "predeterminados" aplica a todos los casos del archivo; cada caso puede
# sobrescribir cualquier campo.
predeterminados:
  agente_esperado: normatividad_rag
  herramientas_esperadas: [mcp_buscar_normatividad]
  metricas: [relevancia]
  etiquetas: [normatividad]

casos:
  - id: norm-lfpdppp-general
    pregunta: ¿Qué dice la Ley Federal de Protección de Datos Personales en Posesión de los Particulares?
    debe_contener: ["Fuentes consultadas"]
    criterio: >
      La respuesta resume el contenido de la ley citando artículos concretos y
      menciona el archivo y la página de donde proviene cada cita.
    etiquetas: [smoke]

  - id: norm-lfpdppp-variante
    pregunta: ¿Qué dice la ley de protección de datos por privados?
    debe_contener: ["Fuentes consultadas"]

  - id: norm-aviso-privacidad
    pregunta: ¿Qué dice el aviso de privacidad de Banamex sobre el tratamiento de datos personales?
    debe_contener: ["Fuentes consultadas"]
    criterio: >
      La respuesta describe cómo trata Banamex los datos personales según su
      aviso de privacidad y no inventa artículos de otras leyes.

  - id: norm-consentimiento
    pregunta: ¿Qué dice la Ley Federal de Protección de Datos Personales sobre el consentimiento?
    debe_contener: ["consentimiento"]

  # Fallo conocido (README): el sintetizador no cruza normativa con metadatos.
  - id: norm-relacion-ley-datos
    pregunta: ¿Qué relación tiene la ley de protección de datos con los datos almacenados?
    herramientas_esperadas: [mcp_buscar_normatividad, mcp_inspeccionar_dataset]
    criterio: >
      La respuesta conecta explícitamente obligaciones de la ley con tablas o
      columnas concretas de la base (por ejemplo, qué columnas contienen datos
      personales y qué exige la ley sobre ellas). No basta con presentar la
      normativa y los metadatos por separado.
    xfail: "Falta plan multi-paso que cruce evidencia normativa con metadatos"
