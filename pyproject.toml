[project]
name = "proyecto-agente-bancario"
version = "0.1.0"
description = "Sistema multiagente bancario con Data Steward, Data Analyst, RAG normativo y lectura de documentos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "langchain>=1.4",
    "langchain-core>=1.6.10",
    "langchain-ollama>=0.3.10",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pillow>=12.0.0",
    "pinecone>=7.0.0",
    "pydantic>=2.13.5",
    "pypdf>=6.0.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.44",
    "sqlglot>=30.31.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "deepeval[inspect]>=4.3.3",
    "isort>=6.1.0",
    "psutil>=7.2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
