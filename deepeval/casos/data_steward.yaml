# Preguntas de estructura y calidad de datos (metadatos, sin SQL analítico).
predeterminados:
  agente_esperado: data_steward
  herramientas_esperadas: [mcp_inspeccionar_dataset]
  # "fidelidad" compara la respuesta con el JSON que devolvieron las tools:
  # detecta columnas o conteos inventados.
  metricas: [relevancia, fidelidad]
  etiquetas: [data_steward]

casos:
  - id: ds-calidad-raw-clientes
    pregunta: ¿Qué problemas de calidad tiene raw_clientes?
    herramientas_esperadas: [mcp_inspeccionar_dataset, mcp_validar_calidad_datos]
    debe_contener: ["raw_clientes"]
    etiquetas: [smoke]

  - id: ds-inspeccionar-raw-clientes
    pregunta: Inspecciona la tabla raw_clientes con el Data Steward.
    debe_contener: ["raw_clientes"]

  # Fallo conocido (README): sin tabla explícita aparecen columnas inventadas.
  - id: ds-estructura-sin-tabla
    pregunta: ¿Cuál es la estructura de las tablas?
    no_debe_contener: ["buró de crédito", "puntaje de buro"]
    xfail: "Sin tabla explícita, la síntesis agrega columnas que no existen"
