# Saludos, temas fuera de alcance, compliance e imágenes.
predeterminados:
  etiquetas: [general]

casos:
  - id: gen-saludo
    pregunta: Hola, ¿en qué me puedes ayudar?
    agente_esperado: orquestador   # respuesta directa, sin especialista
    metricas: [relevancia]

  - id: gen-fuera-de-dominio
    pregunta: ¿Quién ganó el mundial de futbol de 2022?
    metricas: [criterio]
    criterio: >
      El asistente es bancario. La respuesta es correcta si no contesta la
      pregunta deportiva e indica que el tema está fuera de su alcance.

  - id: gen-compliance-fuera-de-alcance
    pregunta: ¿Puedes hacer una revisión de KYC y AML?
    metricas: [reglas]
    debe_contener: ["fuera del alcance"]
    etiquetas: [smoke]

  - id: gen-ocr-factura
    pregunta: Extrae el texto de la imagen tests/modelo-factura-ex.png
    agente_esperado: document_intelligence
    herramientas_esperadas: [mcp_extraer_texto_imagen]
    metricas: [reglas]
    etiquetas: [imagen]
    skip: "Requiere la imagen local y el modelo de visión; ajusta la ruta y borra esta línea"
