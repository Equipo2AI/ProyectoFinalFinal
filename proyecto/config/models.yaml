# Modelos por agente. Es la fuente efectiva: el código lee este archivo al
# inicializar cada agente. Si falta el archivo o una entrada, se usa el valor
# por defecto definido en proyecto/config/models.py.
# DOCUMENT_INTELLIGENCE_MODEL puede sobrescribir el modelo de visión.

agents:
  orchestrator:
    provider: ollama
    model: "qwen2.5:7b-instruct"

  data_steward:
    provider: ollama
    model: "llama3.1:latest"

  normatividad_rag:
    provider: ollama
    model: "llama3.1:latest"

  data_analyst:
    provider: ollama
    model: "qwen2.5:7b-instruct"

  document_intelligence:
    provider: ollama
    model: "qwen2.5vl:7b"

  compliance:
    provider: ollama
    model: "llama3.1:latest"
